# AP lato eliminazione - radio wlan2 nel netns bridge-elim
ssid=WiFi7-Elim
wpa_passphrase=TestPass123!
interface=wlan2
driver=nl80211
ctrl_interface=/var/run/hostapd

# ========== BAND & CHANNEL (6 GHz) ==========
# canale 37 = 6135 MHz, ed e' un PSC (Preferred Scanning Channel): le stazioni
# in 6 GHz cercano di default sui PSC, su un canale non-PSC non troverebbero l'AP.
hw_mode=a
channel=37
op_class=131

# ========== REGULATORY ==========
country_code=IT
ieee80211d=1

# ========== WIRELESS SETTINGS ==========
beacon_int=100
dtim_period=2
max_num_sta=10
auth_algs=1

# ========== WPA3 SECURITY ==========
wpa=2
wpa_key_mgmt=SAE
wpa_pairwise=CCMP CCMP-256
rsn_pairwise=CCMP CCMP-256
ieee80211w=2
sae_pwe=2

# ========== QoS ==========
wme_enabled=1
wmm_enabled=1

# ========== HE (obbligatorio in 6 GHz, dove non esistono modalita' legacy) ====
# niente ieee80211n: HT in banda 6 GHz non esiste
ieee80211ax=1
he_oper_chwidth=0
he_oper_centr_freq_seg0_idx=37
he_6ghz_max_mpdu=2
he_6ghz_max_ampdu_len_exp=7
he_6ghz_reg_pwr_type=0
he_bss_color=37

# ========== WiFi 7 ==========
ieee80211be=1
eht_oper_chwidth=0
eht_oper_centr_freq_seg0_idx=37
mld_ap=0